name: R validation

on:
  push:
  pull_request:

jobs:
  standalone-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - name: Print R version
        run: Rscript --version

      - name: Run TRSC data preparation contract
        run: Rscript --vanilla tests/standalone/test-trsc-data.R

      - name: Run TRSC chronological split contract
        run: Rscript --vanilla tests/standalone/test-trsc-split.R

      - name: Record session info
        run: Rscript --vanilla -e 'sessionInfo()'

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2

      - name: Install development dependencies
        run: Rscript --vanilla -e 'install.packages(c("roxygen2", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Generate documentation
        run: Rscript --vanilla -e 'roxygen2::roxygenise()'

      - name: Run package tests
        run: Rscript --vanilla -e 'testthat::test_dir("tests/testthat", reporter = "summary")'

      - name: Build package
        run: R CMD build .

      - name: Check package
        run: R CMD check --no-manual TRSC_*.tar.gz
