name: R validation
on:
  push:
  pull_request:
jobs:
  standalone-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - name: Print R version
        run: Rscript --version
      - name: Run standalone contracts
        run: Rscript --vanilla tests/standalone/run-tests.R
      - name: Record session info
        run: Rscript --vanilla -e 'sessionInfo()'
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::roxygen2
            any::testthat
          needs: check
      - name: Generate documentation
        run: Rscript --vanilla -e 'roxygen2::roxygenise()'
      - name: Run package, identification, inference and theorem tests
        run: Rscript --vanilla -e 'testthat::test_local(".", reporter = "summary")'
      - name: Build package and vignettes
        run: R CMD build .
      - name: Install built package
        run: R CMD INSTALL TRSC_*.tar.gz
      - name: Run executable workflows
        run: |
          Rscript --vanilla inst/examples/pre-treatment-workflow.R
          Rscript --vanilla inst/examples/post-treatment-identification.R
          Rscript --vanilla inst/examples/honest-inference.R
      - name: Run research simulation harness smoke checks
        run: |
          Rscript --vanilla research/simulations/tests/test-smoke.R
          Rscript --vanilla research/simulations/tests/test-post-smoke.R
          Rscript --vanilla research/simulations/tests/test-frozen-registry.R
      - name: Check package
        run: |
          R CMD check --no-manual TRSC_*.tar.gz
          Rscript -e 'x <- readLines("TRSC.Rcheck/00check.log"); if (any(grepl("(ERROR|WARNING)", x))) stop("Package check reported errors or warnings")'
      - name: Run Stage A non-scientific preflight
        run: Rscript --vanilla research/simulations/run-frozen-study.R --preflight --output-dir research/simulations/output/preflight --ci-tests success --ci-build success --ci-check success
      - name: Retain Stage A preflight manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-preflight
          path: research/simulations/output/preflight/
      - name: Retain check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-check-logs
          path: TRSC.Rcheck/
